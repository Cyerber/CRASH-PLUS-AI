<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deriv AI Scanner V1</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf0f6;background:#0b1118;--panel:#121b25;--line:#263544;--muted:#91a0b1;--green:#35d07f;--red:#ff6b7a;--blue:#66aaff}
*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.sub{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:280px 1fr;gap:14px;margin-top:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}.controls{display:grid;gap:10px}label{font-size:12px;color:var(--muted)}input,select,button{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#0d151e;color:inherit}button{cursor:pointer;font-weight:700}button.primary{background:#235da8;border-color:#3679d0}button.good{background:#145f40}button.bad{background:#742d3a}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#0d151e;border:1px solid var(--line);padding:10px;border-radius:10px}.value{font-size:22px;font-weight:800}.chart{width:100%;height:330px;background:#0b121a;border-radius:10px;border:1px solid var(--line)}canvas{width:100%;height:100%}.signal{font-size:28px;font-weight:900}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.log{height:150px;overflow:auto;font:12px ui-monospace,monospace;color:#b9c7d5;white-space:pre-wrap}.wide{grid-column:1/-1}.small{font-size:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main>
<div class="top"><div><h1>Deriv AI Scanner V1</h1><div class="sub">Live ticks • technical signals • backtesting • demo paper trading</div></div><div class="sub">No real orders are sent</div></div>
<div class="grid">
<section class="panel controls">
<h3>Connection</h3>
<label>Public WebSocket app ID</label><input id="appId" value="1089">
<label>Market</label><select id="symbol"><option value="1HZ100V">Volatility 100 (1s)</option><option value="1HZ75V">Volatility 75 (1s)</option><option value="R_100">Volatility 100</option><option value="R_75">Volatility 75</option><option value="CRASH1000S">Crash 1000 (1s)</option><option value="JUMP1000S">Jump 1000 (1s)</option></select>
<div class="row"><button class="primary" id="connect">Connect</button><button id="disconnect">Stop</button></div>
<h3>Risk</h3>
<label>Paper balance USD</label><input id="balance" type="number" value="30" min="1" step="1">
<label>Risk per trade USD</label><input id="risk" type="number" value="0.30" min="0.01" step="0.01">
<label>Daily loss limit USD</label><input id="limit" type="number" value="1.50" min="0.01" step="0.01">
<label>Reward:risk</label><input id="rr" type="number" value="2" min="0.5" step="0.5">
<button class="good" id="paper">Enable demo paper trading</button>
<button id="reset">Reset paper session</button>
<h3>Backtest</h3><label>Historical ticks</label><input id="count" type="number" value="500" min="100" max="5000">
<button id="backtest">Run historical backtest</button>
<div id="bt" class="small">No backtest run.</div>
</section>
<section class="panel">
<div class="stats"><div class="stat"><div class="small">Price</div><div id="price" class="value">—</div></div><div class="stat"><div class="small">Ticks</div><div id="ticks" class="value">0</div></div><div class="stat"><div class="small">Paper P/L</div><div id="pl" class="value">$0.00</div></div><div class="stat"><div class="small">Win rate</div><div id="wr" class="value">—</div></div></div>
<div class="panel" style="margin-top:12px"><div class="small">Current signal</div><div id="signal" class="signal">WAITING</div><div id="reason" class="small">Connect to begin collecting data.</div></div>
<div class="chart"><canvas id="chart" width="900" height="330"></canvas></div>
<div class="row" style="margin-top:10px"><button id="long" class="good">Paper LONG</button><button id="short" class="bad">Paper SHORT</button><button id="close">Close paper trade</button></div>
</section>
<section class="panel wide"><h3>Activity log</h3><div id="log" class="log"></div></section>
</div></main>
<script>
const $=id=>document.getElementById(id);let ws=null,prices=[],ticks=0,trade=null,paper=false,session={start:30,balance:30,pl:0,wins:0,losses:0};let timer=null;
function log(s){$('log').textContent=`${new Date().toLocaleTimeString()} ${s}\n`+$('log').textContent}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){disconnect();let id=$('appId').value.trim()||'1089';ws=new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${encodeURIComponent(id)}`);ws.onopen=()=>{log('Connected');send({ticks:$('symbol').value,subscribe:1});send({ticks_history:$('symbol').value,count:1000,end:'latest',style:'ticks'});};ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.error){log('API error: '+d.error.message);return}if(d.msg_type==='history'){prices=(d.history.prices||[]).map(Number);draw();evaluate()}if(d.msg_type==='tick'){let p=Number(d.tick.quote);if(Number.isFinite(p)){prices.push(p);if(prices.length>1000)prices.shift();ticks++;$('price').textContent=p; $('ticks').textContent=ticks;draw();evaluate();}}};ws.onerror=()=>log('WebSocket error');ws.onclose=()=>log('Disconnected')}
function disconnect(){if(ws){ws.close();ws=null}if(timer)clearInterval(timer)}
function indicators(a){if(a.length<35)return null;let fast=a.slice(-10).reduce((x,y)=>x+y,0)/10,slow=a.slice(-30).reduce((x,y)=>x+y,0)/30;let recent=a.slice(-12),up=recent.filter((v,i)=>i&&v>recent[i-1]).length,down=recent.filter((v,i)=>i&&v<recent[i-1]).length;let vol=Math.max(...recent)-Math.min(...recent);return {fast,slow,up,down,vol,last:a.at(-1)}}
function evaluate(){let x=indicators(prices);if(!x)return;let s='WAITING',r='Insufficient confirmation';if(x.fast>x.slow&&x.up>=7)s='LONG',r='Fast trend above slow trend; upward tick pressure';else if(x.fast<x.slow&&x.down>=7)s='SHORT',r='Fast trend below slow trend; downward tick pressure';else s='NO TRADE',r='Trend or momentum filters disagree';$('signal').textContent=s;$('signal').className='signal '+(s==='LONG'?'green':s==='SHORT'?'red':'blue');$('reason').textContent=r;if(paper&&!trade&&s!=='NO TRADE'&&s!=='WAITING')log('Signal: '+s+' — manual confirmation required')}
function draw(){let c=$('chart'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);if(prices.length<2)return;let a=prices.slice(-120),lo=Math.min(...a),hi=Math.max(...a),span=hi-lo||1;ctx.strokeStyle='#263544';ctx.lineWidth=1;for(let i=1;i<6;i++){let y=i*h/6;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='#66aaff';ctx.lineWidth=2;ctx.beginPath();a.forEach((p,i)=>{let x=i*(w-20)/(a.length-1)+10,y=h-10-(p-lo)/span*(h-20);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function update(){session.pl=session.balance-session.start;$('pl').textContent=(session.pl>=0?'+':'')+'$'+session.pl.toFixed(2);$('pl').className='value '+(session.pl>=0?'green':'red');let n=session.wins+session.losses;$('wr').textContent=n?(100*session.wins/n).toFixed(1)+'%':'—'}
function openTrade(side){if(!paper||trade)return;let risk=Number($('risk').value),limit=Number($('limit').value);if(session.start-session.balance>=limit){log('Daily loss limit reached');return}if(risk<=0||risk>session.balance){log('Trade rejected: risk exceeds balance');return}trade={side,entry:prices.at(-1),risk,rr:Number($('rr').value),peak:prices.at(-1)};log('Opened paper '+side+' at '+trade.entry)}
function closeTrade(){if(!trade)return;let p=prices.at(-1),move=(p-trade.entry)*(trade.side==='LONG'?1:-1),out=move>=0?trade.risk*trade.rr:-trade.risk;session.balance+=out;if(out>=0)session.wins++;else session.losses++;log('Closed '+trade.side+' '+(out>=0?'WIN ':'LOSS ')+(out>=0?'+':'')+out.toFixed(2));trade=null;update()}
$('connect').onclick=connect;$('disconnect').onclick=disconnect;$('paper').onclick=()=>{paper=!paper;$('paper').textContent=paper?'Disable demo paper trading':'Enable demo paper trading';log(paper?'Paper trading enabled':'Paper trading disabled')};$('long').onclick=()=>openTrade('LONG');$('short').onclick=()=>openTrade('SHORT');$('close').onclick=closeTrade;$('reset').onclick=()=>{session={start:Number($('balance').value)||30,balance:Number($('balance').value)||30,pl:0,wins:0,losses:0};trade=null;update();log('Paper session reset')};
$('backtest').onclick=()=>{if(prices.length<100){$('bt').textContent='Collect at least 100 ticks first.';return}let a=prices.slice(-Number($('count').value)),wins=0,losses=0;for(let i=35;i<a.length-1;i++){let x=indicators(a.slice(0,i)),dir=x&&x.fast>x.slow&&x.up>=7?'LONG':x&&x.fast<x.slow&&x.down>=7?'SHORT':null;if(dir){let move=(a[i+1]-a[i])*(dir==='LONG'?1:-1);move>=0?wins++:losses++}}let n=wins+losses;$('bt').textContent=`Signals: ${n} | Wins: ${wins} | Losses: ${losses} | Win rate: ${n?(100*wins/n).toFixed(1):0}%`;log('Backtest completed on '+a.length+' collected ticks')};
update();log('Ready. This scanner uses a simple illustrative trend/momentum filter; validate it before relying on it.');
</script></body></html>
